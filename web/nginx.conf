server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSE: buffering here is what makes tokens arrive in one lump at the end,
    # so it is off, and the read timeout has to outlive the longest run.
    location /api/ {
        # Resolve the api by name on every request (Docker's DNS, cached 10 s).
        # A literal host in proxy_pass is resolved once, when nginx starts:
        # after `up -d --build` recreated the api with a new address, this
        # container kept the old one and answered 502 until it was restarted
        # (Bob, 2026-10-15). With a variable and no URI part, nginx passes
        # the request URI through unchanged, as before.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
