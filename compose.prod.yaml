# Production overrides for a single host behind a reverse proxy.
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# compose.yaml publishes the API, Postgres and Redis on every interface, which
# is right on a laptop and wrong on a server: Docker's port rules bypass ufw,
# so a published 5432 is reachable from the internet whatever the firewall
# says. Here nothing is published except the web container, and that only on
# 127.0.0.1, for the host's reverse proxy (Caddy) to reach. See docs/DEPLOY.md.

# The api's and the worker's production environment (compose.yaml merges it
# over x-app-env there). Anchors do not cross files, hence the second one.
x-prod-env: &prod-env
  DATABASE_URL: postgresql://waypoint:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/waypoint
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
  MODELS_ALLOWED: ${MODELS_ALLOWED:-}
  LIMITS__RUN_TIMEOUT_S: ${LIMITS__RUN_TIMEOUT_S:-300}
  # A public demo spends real money: no deploy without daily caps.
  BUDGET__ENABLED: "true"
  BUDGET__TENANT_USD_PER_DAY: ${BUDGET__TENANT_USD_PER_DAY:?set BUDGET__TENANT_USD_PER_DAY in .env}
  BUDGET__GLOBAL_USD_PER_DAY: ${BUDGET__GLOBAL_USD_PER_DAY:?set BUDGET__GLOBAL_USD_PER_DAY in .env}
  BUDGET__TENANTS: ${BUDGET__TENANTS:-}
  # Traces to the jaeger service below (observability design, D5 to D7).
  # TRACING__PANEL shows reviewers their own runs' timelines in the app.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  TRACING__QUERY_URL: http://jaeger:16686
  TRACING__PANEL: ${TRACING__PANEL:-false}

services:
  api:
    ports: !reset []
    environment: *prod-env
    depends_on:
      jaeger: { condition: service_started }

  worker:
    environment: *prod-env
    depends_on:
      jaeger: { condition: service_started }

  notes:
    environment:
      NOTES_TOKEN: ${NOTES_TOKEN:?set NOTES_TOKEN in .env}

  web:
    # WEB_PORT differs per demo on a shared host: 8080 here, 8081 for the next.
    ports: !override ["127.0.0.1:${WEB_PORT:-8080}:80"]

  postgres:
    ports: !reset []
    environment:
      # Applied when the volume is first created. Changing it later needs an
      # ALTER ROLE inside the database as well.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  redis:
    ports: !reset []

  # Jaeger v2: OTLP in from the api, traces in Badger on jaeger-data, kept 7
  # days (deploy/jaeger/config.yaml). The UI and query API listen on
  # 127.0.0.1:16686 only: Brent opens it over an SSH tunnel, never through
  # Caddy, because it shows every tenant's traces.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./deploy/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger-data:/badger
    ports: ["127.0.0.1:16686:16686"]
    depends_on:
      jaeger-volume: { condition: service_completed_successfully }
    mem_limit: 512m
    restart: unless-stopped

  # The image runs as uid 10001 and a new named volume belongs to root, so
  # Badger could not create its directories. Runs once per `up`, in a second.
  jaeger-volume:
    image: busybox:1.37
    command: ["chown", "-R", "10001:10001", "/badger"]
    volumes:
      - jaeger-data:/badger
    restart: "no"

volumes:
  jaeger-data:
