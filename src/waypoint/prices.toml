# USD per million tokens: what waypoint.usage prices model, embedding and rerank
# calls with, for eval scorecards and (from phase 1 of the observability design)
# the service's per-run cost and budgets.
# Source: https://platform.claude.com/docs/en/about-claude/pricing
# A model missing here shows tokens only ("cost unknown"); add it to get cost.
# search = USD per web search request (server tool), charged on top of tokens.
# long_threshold / long_input / long_output: rates for prompts above the
# threshold, for models priced by prompt length (usage.call_cost).
# Cache reads and writes are modelled only for the contextualizer's index cost
# (evals/retrieval.py: CACHE_READ, CACHE_WRITE); no agent call site caches.
as_of = "2026-10-08 (Haiku and Sonnet rows checked against the page; Opus 4.5 not)"

[models.claude-haiku-5-5]
input = 0.10
output = 0.50
long_threshold = 100000
long_input = 0.50
long_output = 2.50
search = 0.01

[models.claude-haiku-4-5]
input = 1.0
output = 5.0
search = 0.01

[models.claude-sonnet-5]
input = 2.0
output = 10.0
search = 0.01

[models.claude-sonnet-5-5]
input = 2.0
output = 10.0
search = 0.01

[models.claude-sonnet-4-5]
input = 3.0
output = 15.0
search = 0.01

[models.claude-opus-4-5]
input = 5.0
output = 25.0
search = 0.01

# Embeddings: USD per million input tokens, keyed by the RAG__EMBEDDINGS_MODEL
# spec. Source: https://docs.voyageai.com/docs/pricing, checked 2026-10-10.
# The first 200M tokens per model are free; this prices them anyway.
[embeddings]
"voyageai:voyage-4-large" = 0.12
"voyageai:voyage-4" = 0.06
"voyageai:voyage-4-lite" = 0.02
"voyageai:voyage-context-4" = 0.12
"openai:text-embedding-3-small" = 0.02

# Rerankers: USD per million billed tokens (query tokens x documents + document
# tokens), keyed by RAG__RERANK_MODEL. Same source and date; 200M free tokens.
[rerank]
"rerank-3" = 0.05
"rerank-3-lite" = 0.02
