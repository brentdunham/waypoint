# Infrastructure only -- run the API and Vite on the host against these.
#   docker compose -f compose.dev.yaml up -d
#   uv run python -m waypoint          # :8000
#   uv run python -m waypoint.worker   # drives runs; with Redis up, the API only queues them
#   cd web && npm run dev         # :5173
# Traces: set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 for the API,
# then open http://localhost:16686 (service "waypoint").
name: waypoint-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
      POSTGRES_DB: waypoint
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Jaeger v2 all-in-one: OTLP in, a waterfall view out. In-memory storage,
  # so traces go when the container does; that is all local debugging needs.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP over HTTP
